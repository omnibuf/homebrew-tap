name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Formulas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and test formulas
        run: |
          if [ ! -x "$(command -v brew)" ] && [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap omnibuf/tap "$GITHUB_WORKSPACE"
          brew install --verbose omnibuf/tap/omnibuf
          brew test omnibuf/tap/omnibuf
          brew install --verbose omnibuf/tap/protoc-gen-omnibuf
          brew test omnibuf/tap/protoc-gen-omnibuf
